name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle and Generate Wrapper
        run: |
          # تثبيت أداة gradle على نظام التشغيل لتوليد الملفات الناقصة
          sudo apt-get update && sudo apt-get install -y gradle
          
          # البحث عن المجلد الذي يحتوي على ملف build.gradle
          BUILD_FILE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "Error: No build.gradle file found in the project!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          # الانتقال لمجلد المشروع وتوليد ملف gradlew الناقص
          cd "$PROJECT_DIR"
          gradle wrapper
          chmod +x gradlew
          
          # حفظ المسار لاستخدامه في الخطوة التالية
          echo "GRADLEW_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Android App with Gradle
        run: |
          cd ${{ env.GRADLEW_DIR }}
          ./gradlew assembleDebug
          
