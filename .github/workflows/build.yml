name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Standard Build
        run: |
          BUILD_FILE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE_PATH")
          cd "$PROJECT_DIR"
          
          # تثبيت أداة Gradle مستقلة لتوليد ملف JAR مباشرة بدون تعقيدات الهياكل المفقودة
          sudo apt-get update && sudo apt-get install -y gradle
          gradle jar --no-daemon || gradle build -x test --no-daemon

      - name: Save Mobile App Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: solar-station-app
          path: |
            **/build/libs/*.jar
            **/build/outputs/apk/**/*.apk
