name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android App
        run: |
          BUILD_FILE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE_PATH" ]; then
            echo "Error: Project build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE_PATH")
          cd "$PROJECT_DIR"
          
          # تعديل الأمر إلى build العام ليتوافق مع بنية مشروعك
          gradle build -x test
